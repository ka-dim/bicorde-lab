name: Docker CI

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "client/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker-ci.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Docker integration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build Docker image
        run: docker build --tag bicorde-server:ci .

      - name: Verify container with Python client
        shell: bash
        run: |
          set -euo pipefail

          cleanup() {
            docker logs bicorde-ci || true
            docker rm --force bicorde-ci || true
          }

          trap cleanup EXIT

          docker run \
            --detach \
            --name bicorde-ci \
            --publish 127.0.0.1:3002:3000 \
            bicorde-server:ci

          server_ready=false

          for attempt in {1..10};
          do
            if curl --silent --fail --max-time 2 \
              http://127.0.0.1:3002/health \
              > /dev/null;
            then
              server_ready=true
              break
            fi

            sleep 1
          done

          if [ "$server_ready" != true ];
          then
            echo "The container did not become ready."
            exit 1
          fi

          PYTHONPATH=client/src \
            python -m bicorde_client \
            http://127.0.0.1:3002
