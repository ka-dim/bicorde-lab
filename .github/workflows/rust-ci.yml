name: Rust CI

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  checks:
    name: Rust checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Cache Cargo data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ${{ runner.os }}-rust-stable-cargo-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-stable-cargo-

      - name: Display Rust version
        run: rustc --version

      - name: Check Rust formatting
        working-directory: server
        run: cargo fmt --all -- --check

      - name: Test Rust code
        working-directory: server
        run: cargo test --all-features

      - name: Lint Rust code
        working-directory: server
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build Rust binary
        working-directory: server
        run: cargo build --all-features

      - name: Upload Rust binary
        uses: actions/upload-artifact@v7
        with:
          name: server-linux-debug
          path: server/target/debug/server
          if-no-files-found: error

  msrv:
    name: Rust 1.85 MSRV
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Display MSRV
        run: rustc +1.85.0 --version

      - name: Check with MSRV
        working-directory: server
        run: cargo +1.85.0 check --all-targets --all-features --locked

  verify_artifact:
    name: Verify Rust artifact
    runs-on: ubuntu-latest
    needs:
      - checks

    steps:
      - name: Download Rust binary
        uses: actions/download-artifact@v8
        with:
          name: server-linux-debug
          path: downloaded-server

      - name: Display downloaded files
        run: ls -lh downloaded-server

      - name: Make binary executable
        run: chmod +x downloaded-server/server

      - name: Run downloaded binary
        run: downloaded-server/server
