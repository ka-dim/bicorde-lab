name: Rust CI

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/rust-ci.yml"
  workflow_dispatch:

jobs:
  checks:
    name: Rust checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Cache Cargo data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ${{ runner.os }}-rust-stable-cargo-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-stable-cargo-

      - name: Display Rust version
        run: rustc --version

      - name: Check Rust formatting
        working-directory: server
        run: cargo fmt --all -- --check

      - name: Test Rust code
        working-directory: server
        run: cargo test --all-features

      - name: Lint Rust code
        working-directory: server
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build Rust binary
        working-directory: server
        run: cargo build --all-features

  msrv:
    name: Rust 1.85 MSRV
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Display MSRV
        run: rustc +1.85.0 --version

      - name: Check with MSRV
        working-directory: server
        run: cargo +1.85.0 check --all-targets --all-features --locked
