name: Rust CI

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "client/**"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  checks:
    name: Rust checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Cache Cargo data
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ${{ runner.os }}-rust-stable-cargo-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-stable-cargo-

      - name: Display Rust version
        run: rustc --version

      - name: Check Rust formatting
        working-directory: server
        run: cargo fmt --all -- --check

      - name: Test Rust code
        working-directory: server
        run: cargo test --all-features

      - name: Lint Rust code
        working-directory: server
        run: cargo clippy --all-targets --all-features -- -D warnings

  msrv:
    name: Rust 1.85 MSRV
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Display MSRV
        run: rustc +1.85.0 --version

      - name: Check with MSRV
        working-directory: server
        run: cargo +1.85.0 check --all-targets --all-features --locked

  verify_artifact:
    name: Verify Rust artifact (${{ matrix.platform }})
    needs:
      - package
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            binary: server
            is_windows: false

          - os: windows-latest
            platform: windows-x86_64
            binary: server.exe
            is_windows: true

    steps:
      - name: Download release binary
        uses: actions/download-artifact@v8
        with:
          name: server-${{ matrix.platform }}-release
          path: downloaded-server

      - name: Display Linux artifact
        if: ${{ !matrix.is_windows }}
        run: ls -lh downloaded-server

      - name: Make Linux binary executable
        if: ${{ !matrix.is_windows }}
        run: chmod +x downloaded-server/server

      - name: Verify Linux HTTP server
        if: ${{ !matrix.is_windows }}
        shell: bash
        run: |
          set -euo pipefail

          downloaded-server/server > server.log 2>&1 & server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }

          trap cleanup EXIT

          server_ready=false

          for attempt in {1..10}
          do
            if curl --silent --fail \
              http://127.0.0.1:3000/health \
              > /dev/null
            then
              server_ready=true
              break
            fi

            if ! kill -0 "$server_pid" 2>/dev/null
            then
              cat server.log
              exit 1
            fi

            sleep 1
          done

          if [ "$server_ready" != true ]
          then
            cat server.log
            exit 1
          fi

          curl --fail \
            http://127.0.0.1:3000/health

          curl --fail \
            http://127.0.0.1:3000/version

      - name: Display Windows artifact
        if: matrix.is_windows
        shell: pwsh
        run: Get-ChildItem downloaded-server

      - name: Verify Windows HTTP server
        if: matrix.is_windows
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath ".\downloaded-server\server.exe" `
            -PassThru

          try {
            $healthResponse = $null

            for ($attempt = 1; $attempt -le 10; $attempt++) {
              if ($process.HasExited) {
                throw "The Windows server stopped unexpectedly."
              }

              try {
                $healthResponse = Invoke-RestMethod `
                  -Uri "http://127.0.0.1:3000/health" `
                  -TimeoutSec 2

                break
              }
              catch {
                Start-Sleep -Seconds 1
              }
            }

            if ($null -eq $healthResponse) {
              throw "The Windows server did not become ready."
            }

            if ($healthResponse.status -ne "ok") {
              throw "The Windows server returned an invalid health status."
            }

            $versionResponse = Invoke-RestMethod `
              -Uri "http://127.0.0.1:3000/version" `
              -TimeoutSec 2

            Write-Output "Health response:"
            $healthResponse |
              ConvertTo-Json -Compress |
              Write-Output

            Write-Output "Version response:"
            $versionResponse |
              ConvertTo-Json -Compress |
              Write-Output
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process `
                -Id $process.Id `
                -Force
            }
          }

  package:
    name: Rust package (${{ matrix.platform }})
    needs:
      - checks
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            binary: server

          - os: windows-latest
            platform: windows-x86_64
            binary: server.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Display Rust version
        run: rustc --version

      - name: Build release binary
        working-directory: server
        run: cargo build --release --all-features

      - name: Upload release binary
        uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.platform }}-release
          path: server/target/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 14

  integration:
    name: Rust-Python integration
    needs:
      - package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download Linux release binary
        uses: actions/download-artifact@v8
        with:
          name: server-linux-x86_64-release
          path: downloaded-server

      - name: Run Rust-Python integration
        shell: bash
        run: |
          set -euo pipefail

          chmod +x downloaded-server/server

          downloaded-server/server > server.log 2>&1 & server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }

          trap cleanup EXIT

          server_ready=false

          for attempt in {1..10}
          do
            if curl --silent --fail \
              http://127.0.0.1:3000/health \
              > /dev/null
            then
              server_ready=true
              break
            fi

            if ! kill -0 "$server_pid" 2>/dev/null
            then
              cat server.log
              exit 1
            fi

            sleep 1
          done

          if [ "$server_ready" != true ]
          then
            cat server.log
            exit 1
          fi

          PYTHONPATH=client/src \
            python -m bicorde_client \
            http://127.0.0.1:3000
