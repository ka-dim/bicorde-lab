name: Rust CI

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  checks:
    name: Rust checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Cache Cargo data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ${{ runner.os }}-rust-stable-cargo-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-stable-cargo-

      - name: Display Rust version
        run: rustc --version

      - name: Check Rust formatting
        working-directory: server
        run: cargo fmt --all -- --check

      - name: Test Rust code
        working-directory: server
        run: cargo test --all-features

      - name: Lint Rust code
        working-directory: server
        run: cargo clippy --all-targets --all-features -- -D warnings

  msrv:
    name: Rust 1.85 MSRV
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Display MSRV
        run: rustc +1.85.0 --version

      - name: Check with MSRV
        working-directory: server
        run: cargo +1.85.0 check --all-targets --all-features --locked

  verify_artifact:
    name: Verify Rust artifact (${{ matrix.platform }})
    needs:
      - package
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            binary: server
            is_windows: false

          - os: windows-latest
            platform: windows-x86_64
            binary: server.exe
            is_windows: true

    steps:
      - name: Download release binary
        uses: actions/download-artifact@v8
        with:
          name: server-${{ matrix.platform }}-release
          path: downloaded-server

      - name: Display Linux artifact
        if: ${{ !matrix.is_windows }}
        run: ls -lh downloaded-server

      - name: Make Linux binary executable
        if: ${{ !matrix.is_windows }}
        run: chmod +x downloaded-server/server

      - name: Run Linux binary
        if: ${{ !matrix.is_windows }}
        run: downloaded-server/server

      - name: Display Windows artifact
        if: matrix.is_windows
        shell: pwsh
        run: Get-ChildItem downloaded-server

      - name: Run Windows binary
        if: matrix.is_windows
        shell: pwsh
        run: .\downloaded-server\server.exe

  package:
    name: Rust package (${{ matrix.platform }})
    needs:
      - checks
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            binary: server

          - os: windows-latest
            platform: windows-x86_64
            binary: server.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Display Rust version
        run: rustc --version

      - name: Build release binary
        working-directory: server
        run: cargo build --release --all-features

      - name: Upload release binary
        uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.platform }}-release
          path: server/target/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 14
