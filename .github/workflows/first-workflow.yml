name: First workflow

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "server/**"
      - "client/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "server/**"
      - "client/**"
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest
    env:
      MANUAL_EVENT: workflow_dispatch

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Display execution context
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          echo "Event: $EVENT_NAME"
          echo "Ref: $REF_NAME"
          echo "Runner OS: $RUNNER_OS"

      - name: Confirm manual execution
        if: ${{ github.event_name == env.MANUAL_EVENT }}
        run: echo "This workflow was started manually"

      - name: Display a greeting
        run: echo "Hello from GitHub Actions"
