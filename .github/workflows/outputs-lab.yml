name: Outputs lab

on:
  push:
    branches:
      - ci/module-10-outputs
    paths:
      - ".github/workflows/outputs-lab.yml"
      - "server/Cargo.toml"
      - "server/Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    name: Step boundaries
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      simulated_outcome: ${{ steps.simulated_failure.outcome }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Simulate preparation failure
        id: simulated_failure
        continue-on-error: true
        shell: bash
        run: |
          echo "Intentional failure before version preparation"
          exit 1

      - name: Inspect tolerated failure
        shell: bash
        env:
          RAW_RESULT: ${{ steps.simulated_failure.outcome }}
          FINAL_RESULT: ${{ steps.simulated_failure.conclusion }}
        run: |
          echo "Raw step result: $RAW_RESULT"
          echo "Final step result: $FINAL_RESULT"

      - name: Simulate a slow operation
        timeout-minutes: 1
        shell: bash
        run: |
          echo "Starting an operation within its timeout"
          sleep 2
          echo "Operation completed"

      - name: Define variable and create file
        id: prepare
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(
            cargo metadata \
              --manifest-path server/Cargo.toml \
              --no-deps \
              --format-version 1 \
              --locked |
            jq -er '.packages[] | select(.name == "server") | .version'
          )"

          : "${VERSION:?Missing Cargo package version}"

          echo "First step: VERSION=$VERSION"

          printf '%s\n' "$VERSION" > version.txt

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Inspect variable and file
        shell: bash
        run: |
          echo "Second step: VERSION=${VERSION:-undefined}"

          echo "File content:"
          cat version.txt

      - name: Read step output
        shell: bash
        env:
          PREPARED_VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          echo "Step output: $PREPARED_VERSION"

  consumer:
    name: Read job output
    needs: experiment
    runs-on: ubuntu-latest

    steps:
      - name: Display received version
        shell: bash
        env:
          RECEIVED_VERSION: ${{ needs.experiment.outputs.version }}
        run: |
          : "${RECEIVED_VERSION:?Missing version output}"

          echo "Job output: $RECEIVED_VERSION"

  rust_checks:
    name: Lab Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run Rust tests
        working-directory: server
        run: cargo test --all-features --locked

  python_checks:
    name: Lab Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: client
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run Python tests
        working-directory: client
        run: python -m pytest

  report:
    name: Workflow report
    needs:
      - experiment
      - consumer
      - rust_checks
      - python_checks
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Display workflow results
        shell: bash
        env:
          EXPERIMENT_RESULT: ${{ needs.experiment.result }}
          CONSUMER_RESULT: ${{ needs.consumer.result }}
          PROJECT_VERSION: ${{ needs.experiment.outputs.version }}
          SIMULATED_OUTCOME: ${{ needs.experiment.outputs.simulated_outcome }}
          RUST_RESULT: ${{ needs.rust_checks.result }}
          PYTHON_RESULT: ${{ needs.python_checks.result }}
        run: |
          echo "Workflow report"
          echo "Experiment: $EXPERIMENT_RESULT"
          echo "Consumer: $CONSUMER_RESULT"
          echo "Version: ${PROJECT_VERSION:-unavailable}"
          echo "Simulated step outcome: ${SIMULATED_OUTCOME:-unavailable}"
          echo "Rust tests: $RUST_RESULT"
          echo "Python tests: $PYTHON_RESULT"
          {
            echo "## Bilan du laboratoire"
            echo ""
            echo "| Élément | Résultat |"
            echo "|---|---|"
            echo "| Experiment | $EXPERIMENT_RESULT |"
            echo "| Consumer | $CONSUMER_RESULT |"
            echo "| Version | ${PROJECT_VERSION:-unavailable} |"
            echo "| Échec simulé — résultat brut | ${SIMULATED_OUTCOME:-unavailable} |"
            echo "| Rust tests | $RUST_RESULT |"
            echo "| Python tests | $PYTHON_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"
